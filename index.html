<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --font: 'Cairo', sans-serif;
    --bg: #0b1220;
    --surface: #121b2e;
    --primary: #c08b3d;
    --accent: #1f8a70;
    --radius: 12px;
    --text: #0F172A;
    --text-muted: #64748B;
    --border: rgba(0,0,0,0.06);
    --card-shadow: 0 4px 20px -2px rgba(0,0,0,0.04);
  }
  [data-theme="dark"] {
    --bg: #0B1220;
    --surface: #121B2E;
    --text: #EDEFF3;
    --text-muted: #94A3B8;
    --border: rgba(255,255,255,0.08);
    --card-shadow: 0 4px 20px -2px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background .25s ease, color .25s ease;
  }
  a { text-decoration: none; color: inherit; }

  /* Top Navigation Bar */
  .p-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 48px;
    display: flex; justify-content: space-between; align-items: center;
    transition: background .25s ease;
  }
  [data-theme="dark"] .p-nav { background: rgba(18, 27, 46, 0.88); }
  .p-logo { font-size: 19px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .p-nav-links { display: flex; align-items: center; gap: 24px; font-weight: 600; font-size: 14px; color: var(--text-muted); }
  .p-nav-links a { transition: color .2s; }
  .p-nav-links a:hover, .p-nav-links a.active { color: var(--accent); }
  .p-nav-actions { display: flex; align-items: center; gap: 14px; }
  
  .p-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 20px; border-radius: 8px; font-weight: 700; font-size: 13.5px;
    cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent;
  }
  .p-btn-primary { background: var(--primary); color: #fff; }
  .p-btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .p-btn-outline { border-color: var(--border); background: var(--surface); color: var(--text); }
  .p-btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  .lang-select-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .theme-toggle-btn {
    background: transparent; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 6px;
  }

  /* Two Column Main Architecture */
  .p-wrapper {
    max-width: 1240px; margin: 36px auto; padding: 0 24px;
    display: grid; grid-template-columns: 340px 1fr; gap: 36px;
  }
  html[dir="rtl"] .p-wrapper { grid-template-columns: 1fr 340px; }

  /* Hero Column & Sticky Card */
  .p-sidebar { height: fit-content; }
  .p-profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 24px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }
  .p-avatar-wrap {
    width: 210px; height: 210px; margin: 0 auto 20px;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1F4056 0%, #102636 100%);
    box-shadow: 0 10px 25px rgba(14,165,233,0.25);
  }
  .p-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .p-profile-card h1 { font-size: 24px; color: var(--primary); margin-bottom: 6px; font-weight: 800; }
  .p-profile-card h2 { font-size: 15px; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
  .p-profile-card p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
  .p-profile-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .p-social-row { display: flex; justify-content: center; gap: 14px; font-size: 17px; color: var(--text-muted); }
  .p-social-row a:hover { color: var(--accent); }

  /* Content Cards */
  .p-content { display: flex; flex-direction: column; gap: 28px; }
  .p-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px;
    box-shadow: var(--card-shadow);
  }
  .p-section-head { font-size: 19px; font-weight: 800; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }

  /* 4 Stat Boxes Matrix */
  .p-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
  .p-stat-box {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: center; background: var(--bg);
  }
  .p-stat-box b { display: block; font-size: 26px; font-weight: 800; color: var(--primary); line-height: 1.1; }
  .p-stat-box span { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; }

  /* Timeline */
  .p-timeline { position: relative; margin-top: 8px; }
  .p-timeline-item {
    position: relative;
    padding-inline-start: 24px;
    border-inline-start: 2px solid var(--border);
    padding-bottom: 24px;
  }
  .p-timeline-item:last-child { padding-bottom: 0; }
  .p-timeline-item::before {
    content: ""; position: absolute;
    inset-inline-start: -6px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .p-timeline-role { font-size: 15.5px; font-weight: 700; color: var(--primary); }
  .p-timeline-meta { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .p-timeline-bullets { list-style: disc; margin-inline-start: 18px; font-size: 13px; color: var(--text-muted); }

  /* Projects Grid */
  .p-projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .p-project-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--surface); display: flex; flex-direction: column;
  }
  .p-project-img { width: 100%; height: 150px; object-fit: cover; background: var(--bg); }
  .p-project-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
  .p-project-title { font-size: 15.5px; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
  .p-project-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; flex: 1; }
  .p-tags-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .p-tag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: rgba(14,165,233,0.1); color: var(--accent); }
  .p-project-actions { display: flex; gap: 8px; }

  /* Skills & Education Grid */
  .p-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .p-skill-cat { margin-bottom: 14px; }
  .p-skill-cat h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
  .p-skill-badges { display: flex; flex-wrap: wrap; gap: 7px; }
  .p-skill-badge { font-size: 12px; padding: 5px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; font-weight: 600; }

  /* Contact Form */
  .p-contact-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .p-contact-form .full { grid-column: span 2; }
  .p-input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 13.5px; color: var(--text); }
  .p-input:focus { outline: none; border-color: var(--accent); }

  /* Footer */
  .p-footer { text-align: center; padding: 30px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 40px; }

  @media(max-width: 960px) {
    .p-wrapper { grid-template-columns: 1fr !important; }
    .p-nav { padding: 12px 20px; }
    .p-nav-links { display: none; }
    .p-stats-grid { grid-template-columns: 1fr 1fr; }
    .p-two-col { grid-template-columns: 1fr; }
    .p-contact-form { grid-template-columns: 1fr; }
    .p-contact-form .full { grid-column: span 1; }
  }
</style>
</head>

    sections.forEach(sec => {
      const top = sec.offsetTop;
      const height = sec.offsetHeight;
      const id = sec.getAttribute('id');
      if(scrollPos >= top && scrollPos < top + height) {
        document.querySelectorAll('.p-nav-links a').forEach(a => {
          a.classList.remove('active');
          if(a.getAttribute('href') === '#' + id) a.classList.add('active');
        });
      }
    });
  });

  renderPortfolio(currLang);
</script>
</body>
</html>
