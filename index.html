<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --font: 'Cairo', sans-serif;
    --bg-light: #F8FAFC;
    --surface-light: #FFFFFF;
    --text-light: #0F172A;
    --muted-light: #64748B;
    --border-light: rgba(0,0,0,0.06);

    --bg-dark: #0B1220;
    --surface-dark: #121B2E;
    --text-dark: #EDEFF3;
    --muted-dark: #94A3B8;
    --border-dark: rgba(255,255,255,0.08);

    --primary: #c08b3d;
    --accent: #1f8a70;
    --radius: 12px;

    --bg: var(--bg-light);
    --surface: var(--surface-light);
    --text: var(--text-light);
    --text-muted: var(--muted-light);
    --border: var(--border-light);
    --card-shadow: 0 4px 20px -2px rgba(0,0,0,0.04);
  }
  [data-theme="dark"] {
    --bg: var(--bg-dark);
    --surface: var(--surface-dark);
    --text: var(--text-dark);
    --text-muted: var(--muted-dark);
    --border: var(--border-dark);
    --card-shadow: 0 4px 20px -2px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background .25s ease, color .25s ease;
  }
  a { text-decoration: none; color: inherit; }

  /* Top Navigation Bar */
  .p-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 48px;
    display: flex; justify-content: space-between; align-items: center;
    transition: background .25s ease;
  }
  [data-theme="dark"] .p-nav { background: rgba(18, 27, 46, 0.92); }
  .p-logo { font-size: 19px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  [data-theme="dark"] .p-logo { color: #fff; }
  .p-nav-links { display: flex; align-items: center; gap: 20px; font-weight: 600; font-size: 14px; color: var(--text-muted); }
  .p-nav-links a { transition: color .2s; }
  .p-nav-links a:hover, .p-nav-links a.active { color: var(--accent); }
  .p-nav-actions { display: flex; align-items: center; gap: 12px; }
  
  .p-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 20px; border-radius: 8px; font-weight: 700; font-size: 13.5px;
    cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent;
  }
  .p-btn-primary { background: var(--primary); color: #fff; }
  .p-btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .p-btn-outline { border-color: var(--border); background: var(--surface); color: var(--text); }
  .p-btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  .lang-select-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .theme-toggle-btn {
    background: transparent; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 6px;
  }

  /* Two Column Main Architecture */
  .p-wrapper {
    max-width: 1240px; margin: 36px auto; padding: 0 24px;
    display: grid; grid-template-columns: 340px 1fr; gap: 36px;
  }
  html[dir="rtl"] .p-wrapper { grid-template-columns: 1fr 340px; }

  /* Hero Column & Sticky Card */
  .p-sidebar { height: fit-content; }
  .p-profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 24px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }
  .p-avatar-wrap {
    width: 200px; height: 200px; margin: 0 auto 20px;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1F4056 0%, #102636 100%);
    box-shadow: 0 10px 25px rgba(14,165,233,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .p-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .p-profile-card h1 { font-size: 24px; color: var(--primary); margin-bottom: 6px; font-weight: 800; }
  [data-theme="dark"] .p-profile-card h1 { color: #fff; }
  .p-profile-card h2 { font-size: 15px; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
  .p-profile-card p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
  .p-profile-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .p-social-row { display: flex; justify-content: center; gap: 14px; font-size: 18px; color: var(--text-muted); }
  .p-social-row a:hover { color: var(--accent); }

  /* Floating Chips in Portfolio */
  .p-chips-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .p-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: rgba(14,165,233,0.08); color: var(--accent); font-size: 12px; font-weight: 600; }

  /* Content Cards */
  .p-content { display: flex; flex-direction: column; gap: 28px; }
  .p-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px;
    box-shadow: var(--card-shadow);
  }
  .p-section-head { font-size: 19px; font-weight: 800; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  [data-theme="dark"] .p-section-head { color: #fff; }

  /* Empty state placeholder within sections */
  .p-empty-state {
    padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; font-style: italic; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* 4 Stat Boxes Matrix */
  .p-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
  .p-stat-box {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: center; background: var(--bg);
  }
  .p-stat-box b { display: block; font-size: 26px; font-weight: 800; color: var(--primary); line-height: 1.1; }
  [data-theme="dark"] .p-stat-box b { color: #fff; }
  .p-stat-box span { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; }

  /* Timeline */
  .p-timeline { position: relative; margin-top: 8px; }
  .p-timeline-item {
    position: relative;
    padding-inline-start: 24px;
    border-inline-start: 2px solid var(--border);
    padding-bottom: 24px;
  }
  .p-timeline-item:last-child { padding-bottom: 0; }
  .p-timeline-item::before {
    content: ""; position: absolute;
    inset-inline-start: -6px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .p-timeline-role { font-size: 15.5px; font-weight: 700; color: var(--primary); }
  [data-theme="dark"] .p-timeline-role { color: #fff; }
  .p-timeline-meta { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .p-timeline-bullets { list-style: disc; margin-inline-start: 18px; font-size: 13px; color: var(--text-muted); }

  /* Projects Grid */
  .p-projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .p-project-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--surface); display: flex; flex-direction: column;
  }
  .p-project-img { width: 100%; height: 150px; object-fit: cover; background: var(--bg); }
  .p-project-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
  .p-project-title { font-size: 15.5px; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
  [data-theme="dark"] .p-project-title { color: #fff; }
  .p-project-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; flex: 1; }
  .p-tags-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .p-tag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: rgba(14,165,233,0.1); color: var(--accent); }

  /* Skills & Education Grid */
  .p-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .p-skill-cat { margin-bottom: 14px; }
  .p-skill-cat h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  [data-theme="dark"] .p-skill-cat h4 { color: #fff; }
  .p-skill-badges { display: flex; flex-wrap: wrap; gap: 7px; }
  .p-skill-badge { font-size: 12px; padding: 5px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; font-weight: 600; }

  /* Contact Form */
  .p-contact-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .p-contact-form .full { grid-column: span 2; }
  .p-input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 13.5px; color: var(--text); }
  .p-input:focus { outline: none; border-color: var(--accent); }

  /* Footer */
  .p-footer { text-align: center; padding: 30px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 40px; }

  @media(max-width: 960px) {
    .p-wrapper { grid-template-columns: 1fr !important; }
    .p-nav { padding: 12px 20px; }
    .p-nav-links { display: none; }
    .p-stats-grid { grid-template-columns: 1fr 1fr; }
    .p-two-col { grid-template-columns: 1fr; }
    .p-contact-form { grid-template-columns: 1fr; }
    .p-contact-form .full { grid-column: span 1; }
  }
</style>
</head>

  <!-- Top Navbar -->

    <div class="p-nav-links" id="dynamicNavLinks"></div>

      </button>

  <div class="p-wrapper">
    <!-- Profile Card -->
    <aside class="p-sidebar">

        </div>
        <div class="p-social-row" id="p_socials"></div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="p-content">
      
      <!-- About Me & 4 Stats Cards -->
      <section class="p-card" id="about">
        <div class="p-section-head" id="head_about"><i class="fa-regular fa-user" style="color:var(--accent);"></i> About Me</div>

        <div class="p-stats-grid" id="statsContainer"></div>
      </section>

      <!-- Work Experience Timeline -->
      <section class="p-card" id="experience">
        <div class="p-section-head" id="head_exp"><i class="fa-solid fa-briefcase" style="color:var(--accent);"></i> Work Experience</div>
        <div class="p-timeline" id="expContainer"></div>
      </section>

      <!-- Skills Matrix & Education -->
      <div class="p-two-col">
        <section class="p-card" id="skills">
          <div class="p-section-head" id="head_skills"><i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> Skills</div>
          <div id="skillsContainer"></div>
        </section>

        <section class="p-card" id="education">
          <div class="p-section-head" id="head_edu"><i class="fa-solid fa-graduation-cap" style="color:var(--accent);"></i> Education</div>
          <div id="eduContainer">
            <div style="margin-bottom:16px;">
              <h4 style="font-size:14.5px; color:var(--primary); font-weight:700;" id="edu_deg_title"></h4>
              <p style="font-size:12.5px; color:var(--text-muted);" id="edu_deg_meta"></p>
            </div>
            <div>
              <h4 style="font-size:14.5px; color:var(--primary); font-weight:700;" id="edu_cert_title"></h4>
              <p style="font-size:12.5px; color:var(--text-muted);" id="edu_cert_meta"></p>
            </div>
          </div>
        </section>
      </div>

      <!-- Projects Section -->
      <section class="p-card" id="projects">
        <div class="p-section-head" id="head_projects"><i class="fa-solid fa-diagram-project" style="color:var(--accent);"></i> Projects</div>
        <div class="p-projects-grid" id="projectsContainer"></div>
      </section>

      <!-- Contact Form -->
      <section class="p-card" id="contact">
        <div class="p-section-head" id="head_contact"><i class="fa-regular fa-paper-plane" style="color:var(--accent);"></i> Contact Me</div>
        <p style="color:var(--text-muted); font-size:13.5px; margin-bottom:18px;" id="contactMeta"></p>
        <form class="p-contact-form" onsubmit="event.preventDefault(); alert(currLang==='ar'?'شكراً لتواصلك!':'Thank you for your message!');">
          <input class="p-input" type="text" id="inp_name" placeholder="Name" required>
          <input class="p-input" type="email" id="inp_email" placeholder="Email" required>
          <textarea class="p-input full" rows="4" id="inp_msg" placeholder="Message..." required></textarea>
          <button class="p-btn p-btn-primary full" style="padding:13px;" id="btn_sendMsg">Send Message</button>
        </form>
      </section>

    </main>
  </div>

  <footer class="p-footer" id="footerText"></footer>

    currLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    var dict = i18n[lang] || i18n.en;
    var d = DATA[lang] || {};
    var g = DATA.global || {};

    var hasName = Boolean(d.hero && d.hero.brandName && d.hero.brandName.trim());
    document.getElementById('docTitle').innerText = (hasName ? d.hero.brandName + " — " : "") + dict.about;
    document.getElementById('navBrand').innerText = hasName ? d.hero.brandName : "Portfolio";
    document.getElementById('l_startBtn').innerText = dict.startBtn;
    document.getElementById('currentLangLabel').innerText = dict.langToggle;

    // Dynamic Top Navigation Generation (Only links with content)
    var navLinksCont = document.getElementById('dynamicNavLinks');
    var navHtml = '';
    if(d.about && (d.about.p1 || (d.stats && d.stats.length))) navHtml += '<a href="#about" class="nav-link">' + dict.about + '</a>';
    if(d.experience && d.experience.length) navHtml += '<a href="#experience" class="nav-link">' + dict.experience + '</a>';
    if(d.skillCats && d.skillCats.length) navHtml += '<a href="#skills" class="nav-link">' + dict.skills + '</a>';
    if((d.education && d.education.degreeTitle) || (d.education && d.education.icdlTitle)) navHtml += '<a href="#education" class="nav-link">' + dict.education + '</a>';
    if(d.projects && d.projects.length) navHtml += '<a href="#projects" class="nav-link">' + dict.projects + '</a>';
    navHtml += '<a href="#contact" class="nav-link">' + dict.contact + '</a>';
    navLinksCont.innerHTML = navHtml;

    document.getElementById('head_about').innerHTML = '<i class="fa-regular fa-user" style="color:var(--accent);"></i> ' + dict.about;
    document.getElementById('head_exp').innerHTML = '<i class="fa-solid fa-briefcase" style="color:var(--accent);"></i> ' + dict.experience;
    document.getElementById('head_skills').innerHTML = '<i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> ' + dict.skills;
    document.getElementById('head_edu').innerHTML = '<i class="fa-solid fa-graduation-cap" style="color:var(--accent);"></i> ' + dict.education;
    document.getElementById('head_projects').innerHTML = '<i class="fa-solid fa-diagram-project" style="color:var(--accent);"></i> ' + dict.projects;
    document.getElementById('head_contact').innerHTML = '<i class="fa-regular fa-paper-plane" style="color:var(--accent);"></i> ' + dict.contact;

    // Sidebar & Profile
    var imgEl = document.getElementById('p_avatar');
    var imgPlaceholder = document.getElementById('p_avatar_placeholder');
    if(g.aboutData && g.aboutData.profileImg) {
      imgEl.src = g.aboutData.profileImg;
      imgEl.style.display = 'block';
      imgPlaceholder.style.display = 'none';
    } else {
      imgEl.style.display = 'none';
      imgPlaceholder.style.display = 'block';
    }

    document.getElementById('p_name').innerText = (d.hero && d.hero.brandName) ? d.hero.brandName : (lang === 'ar' ? 'الاسم لم يحدد' : 'Name not set');
    document.getElementById('p_role').innerText = (d.hero && (d.hero.eyebrow || d.hero.title1)) ? (d.hero.eyebrow || d.hero.title1) : '';
    document.getElementById('p_lead').innerText = (d.about && d.about.p1) ? d.about.p1 : ((d.hero && d.hero.lead) ? d.hero.lead : '');

    // Floating Chips
    var chipsCont = document.getElementById('p_chips');
    chipsCont.innerHTML = (d.chips || []).map(function(c) {
      return '<span class="p-chip"><i class="' + getIconCls(c.icon) + '"></i> ' + (c.label || '') + '</span>';
    }).join('');

    // CV Action
    var cvBtn = document.getElementById('p_cvBtn');
    cvBtn.innerText = dict.downloadCv;
    cvBtn.onclick = function() {
      if(g.contactData && g.contactData.cvLink && g.contactData.cvLink.trim().length > 3) {
        window.open(g.contactData.cvLink, '_blank');
      } else {
        generateProfessionalPDF();
      }
    };

    document.getElementById('p_contactBtn').innerText = dict.contactBtn;

    // Social Links
    var socialCont = document.getElementById('p_socials');
    var socialsHtml = '';
    if(g.contactData && g.contactData.email) socialsHtml += '<a href="mailto:' + g.contactData.email + '" title="Email"><i class="fa-solid fa-envelope"></i></a>';
    if(g.contactData && g.contactData.phone) socialsHtml += '<a href="tel:' + g.contactData.phone + '" title="Phone"><i class="fa-solid fa-phone"></i></a>';
    if(g.contactData && g.contactData.linkedin) socialsHtml += '<a href="' + g.contactData.linkedin + '" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>';
    if(g.contactData && g.contactData.website) socialsHtml += '<a href="' + g.contactData.website + '" target="_blank" title="Website"><i class="fa-solid fa-globe"></i></a>';
    socialCont.innerHTML = socialsHtml;

    // About & Stats
    document.getElementById('sec_about_text').innerText = (d.about && d.about.p1) ? d.about.p1 : ((d.hero && d.hero.lead) ? d.hero.lead : '');
    document.getElementById('statsContainer').innerHTML = (d.stats || []).map(function(s) {
      return '<div class="p-stat-box"><b>' + (s.value || 0) + '+</b><span>' + (s.label || '') + '</span></div>';
    }).join('');

    // Experience Section
    var expCont = document.getElementById('expContainer');
    if(d.experience && d.experience.length) {
      expCont.innerHTML = d.experience.map(function(exp) {
        var bulletsHtml = (exp.bullets || []).map(function(b) { return '<li>' + b + '</li>'; }).join('');
        return '<div class="p-timeline-item">' +
          '<div class="p-timeline-role">' + (exp.role || '') + '</div>' +
          '<div class="p-timeline-meta">' + (exp.company || '') + (exp.period ? ' · ' + exp.period : '') + '</div>' +
          '<ul class="p-timeline-bullets">' + bulletsHtml + '</ul>' +
        '</div>';
      }).join('');
    } else {
      expCont.innerHTML = '<div class="p-empty-state">' + dict.emptyExp + '</div>';
    }

    // Skills Matrix
    var skillsCont = document.getElementById('skillsContainer');
    if(d.skillCats && d.skillCats.length) {
      skillsCont.innerHTML = d.skillCats.map(function(cat) {
        var badgesHtml = (cat.skills || []).map(function(s) {
          return '<span class="p-skill-badge">' + (s.label || '') + '</span>';
        }).join('');
        return '<div class="p-skill-cat">' +
          '<h4><i class="' + getIconCls(cat.icon) + '" style="color:var(--accent);"></i> ' + (cat.name || '') + '</h4>' +
          '<div class="p-skill-badges">' + badgesHtml + '</div>' +
        '</div>';
      }).join('');
    } else {
      skillsCont.innerHTML = '<div class="p-empty-state">' + dict.emptySkills + '</div>';
    }

    // Education
    var eduCont = document.getElementById('eduContainer');
    if(d.education && (d.education.degreeTitle || d.education.icdlTitle)) {
      document.getElementById('edu_deg_title').innerText = d.education.degreeTitle || "";
      document.getElementById('edu_deg_meta').innerText = d.education.degreeMeta || "";
      document.getElementById('edu_cert_title').innerText = d.education.icdlTitle || "";
      document.getElementById('edu_cert_meta').innerText = d.education.icdlMeta || "";
    } else {
      eduCont.innerHTML = '<div class="p-empty-state">' + dict.emptyEdu + '</div>';
    }

    // Projects
    var projCont = document.getElementById('projectsContainer');
    if(d.projects && d.projects.length) {
      projCont.innerHTML = d.projects.map(function(p) {
        var tagsHtml = (p.tags || []).map(function(t) { return '<span class="p-tag">' + t + '</span>'; }).join('');
        var linkHtml = p.link ? '<div class="p-project-actions"><a href="' + p.link + '" target="_blank" class="p-btn p-btn-outline" style="padding:6px 12px; font-size:12px;"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>' : '';
        var imgHtml = p.img ? '<img src="' + p.img + '" class="p-project-img" alt="' + (p.title || '') + '">' : '<div class="p-project-img" style="display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--accent);"><i class="' + getIconCls(p.icon) + '"></i></div>';
        return '<div class="p-project-card">' +
          imgHtml +
          '<div class="p-project-body">' +
            '<div class="p-project-title">' + (p.title || '') + '</div>' +
            '<div class="p-project-desc">' + (p.desc || '') + '</div>' +
            '<div class="p-tags-group">' + tagsHtml + '</div>' +
            linkHtml +
          '</div>' +
        '</div>';
      }).join('');
    } else {
      projCont.innerHTML = '<div class="p-empty-state" style="grid-column:1/-1;">' + dict.emptyProj + '</div>';
    }

    // Contact
    var metaTxt = [];
    if(d.contact && d.contact.location) metaTxt.push(d.contact.location);
    if(g.contactData && g.contactData.email) metaTxt.push(g.contactData.email);
    if(g.contactData && g.contactData.phone) metaTxt.push(g.contactData.phone);
    document.getElementById('contactMeta').innerText = metaTxt.join(' · ');

    document.getElementById('inp_name').placeholder = dict.nameHolder;
    document.getElementById('inp_email').placeholder = dict.emailHolder;
    document.getElementById('inp_msg').placeholder = dict.msgHolder;
    document.getElementById('btn_sendMsg').innerText = dict.sendMsg;

    document.getElementById('footerText').innerHTML = '© ' + new Date().getFullYear() + ' ' + ((d.hero && d.hero.brandName) ? d.hero.brandName : '') + '. ' + dict.rights;
  }

  document.getElementById('langSwitcherBtn').addEventListener('click', function() {
    renderPortfolio(currLang === 'ar' ? 'en' : 'ar');
  });

  var themeBtn = document.getElementById('themeToggleBtn');
  function applyTheme(dark) {
    isDarkMode = dark;
    if(dark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
  }
  themeBtn.addEventListener('click', function() { applyTheme(!isDarkMode); });
  applyTheme(isDarkMode);

  window.addEventListener('scroll', function() {
    var sections = document.querySelectorAll('section');
    var scrollPos = window.scrollY + 100;
    sections.forEach(function(sec) {
      var top = sec.offsetTop;
      var height = sec.offsetHeight;
      var id = sec.getAttribute('id');
      if(scrollPos >= top && scrollPos < top + height) {
        document.querySelectorAll('.p-nav-links a').forEach(function(a) {
          a.classList.remove('active');
          if(a.getAttribute('href') === '#' + id) a.classList.add('active');
        });
      }
    });
  });

  renderPortfolio(currLang);
</script>
</body>
</html>
