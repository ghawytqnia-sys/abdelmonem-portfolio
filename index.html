<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<base target="_self">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --h-font: 'Cairo', sans-serif;
    --b-font: 'Cairo', sans-serif;
    --bg-light: #f8fafc;
    --surface-light: #ffffff;
    --text-light: #0f172a;
    --muted-light: #64748b;
    --border-light: #e2e8f0;

    --bg-dark: #0B1220;
    --surface-dark: #121B2E;
    --text-dark: #EDEFF3;
    --muted-dark: #94A3B8;
    --border-dark: rgba(255,255,255,0.08);

    --primary: #1e293b;
    --accent: #0ea5e9;
    --radius: 16px;
    --skill-bar-height: 6px;

    --bg: var(--bg-light);
    --surface: var(--surface-light);
    --text: var(--text-light);
    --text-muted: var(--muted-light);
    --border: var(--border-light);
    --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.03);
  }
  [data-theme="dark"] {
    --bg: var(--bg-dark);
    --surface: var(--surface-dark);
    --text: var(--text-dark);
    --text-muted: var(--muted-dark);
    --border: var(--border-dark);
    --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--b-font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    overflow-x: hidden;
    transition: background .25s ease, color .25s ease;
    user-select: text;
    -webkit-user-select: text;
  }
  h1, h2, h3, h4, h5, h6 { font-family: var(--h-font); }
  a { text-decoration: none; color: inherit; }
  .p-card, .p-timeline-item, .p-cert-card, .p-project-card, .p-contact-item {
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .p-nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 16px 48px;
    display: flex; justify-content: space-between; align-items: center;
    transition: background .25s ease;
  }
  [data-theme="dark"] .p-nav { background: rgba(18, 27, 46, 0.92); }
  .p-logo { font-family: var(--h-font); font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
  [data-theme="dark"] .p-logo { color: #fff; }
  .p-nav-links { display: flex; align-items: center; gap: 24px; font-weight: 600; font-size: 14.5px; color: var(--text-muted); }
  .p-nav-links a { transition: color .2s ease; position: relative; padding: 4px 0; cursor: pointer; }
  .p-nav-links a:hover, .p-nav-links a.active { color: var(--accent); }
  .p-nav-links a.active::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .p-nav-actions { display: flex; align-items: center; gap: 12px; }
  .p-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 22px; border-radius: 9px; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent;
  }
  .p-btn-primary { background: var(--primary); color: #fff; }
  .p-btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .p-btn-outline { border-color: var(--border); background: var(--surface); color: var(--text); }
  .p-btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  .lang-select-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 7px 14px; border-radius: 8px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .theme-toggle-btn {
    background: transparent; border: none; font-size: 17px; color: var(--text-muted); cursor: pointer; padding: 6px;
  }
  .p-mobile-menu-btn {
    display: none; background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 18px; cursor: pointer;
  }
  .p-mobile-drawer {
    display: none; position: fixed; top: 68px; left: 0; right: 0; background: var(--surface);
    border-bottom: 1px solid var(--border); padding: 20px 24px; box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    z-index: 999; flex-direction: column; gap: 14px; animation: slideDown 0.25s ease;
  }
  .p-mobile-drawer.open { display: flex; }
  .p-mobile-drawer a { font-size: 15px; font-weight: 600; color: var(--text); padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .p-wrapper {
    max-width: 1320px; margin: 44px auto; padding: 0 32px;
    display: grid; grid-template-columns: minmax(320px, 360px) 1fr; gap: 40px;
    align-items: start;
  }
  html[dir="rtl"] .p-wrapper { grid-template-columns: 1fr minmax(320px, 360px); }
  .p-sidebar { height: fit-content; position: sticky; top: 100px; }
  .p-profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 38px 28px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }
  .p-avatar-wrap {
    width: 210px; height: 210px; margin: 0 auto 24px;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1F4056 0%, #102636 100%);
    box-shadow: 0 12px 30px rgba(14,165,233,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .p-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .p-profile-card h1 { font-size: clamp(1.4rem, 2vw, 1.75rem); color: var(--primary); margin-bottom: 8px; font-weight: 800; line-height: 1.25; }
  [data-theme="dark"] .p-profile-card h1 { color: #fff; }
  .p-profile-card h2 { font-size: 15px; color: var(--accent); font-weight: 600; margin-bottom: 16px; line-height: 1.4; }
  .p-profile-card p { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 24px; }
  .p-profile-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .p-social-row { display: flex; justify-content: center; gap: 16px; font-size: 20px; color: var(--text-muted); }
  .p-social-row a:hover { color: var(--accent); transform: scale(1.1); transition: transform 0.2s; }
  .p-chips-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .p-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px; border-radius: 20px; background: rgba(14,165,233,0.08); color: var(--accent); font-size: 12.5px; font-weight: 600; }
  .p-content { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
  .p-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px;
    box-shadow: var(--card-shadow);
  }
  .p-section-head { font-size: clamp(1.2rem, 1.5vw, 1.45rem); font-weight: 800; color: var(--primary); margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
  [data-theme="dark"] .p-section-head { color: #fff; }
  .p-empty-state {
    padding: 26px; text-align: center; color: var(--text-muted); font-size: 13.5px; font-style: italic; border: 1px dashed var(--border); border-radius: 8px;
  }
  .p-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
  .p-stat-box {
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px);
    padding: 18px 12px; text-align: center; background: var(--bg);
  }
  .p-stat-box b { font-family: var(--h-font); display: block; font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1.1; }
  [data-theme="dark"] .p-stat-box b { color: #fff; }
  .p-stat-box span { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-top: 6px; display: block; }
  .p-timeline { position: relative; margin-top: 10px; }
  .p-timeline-item {
    position: relative;
    padding-inline-start: 28px;
    border-inline-start: 2px solid var(--border);
    padding-bottom: 28px;
  }
  .p-timeline-item:last-child { padding-bottom: 0; }
  .p-timeline-item::before {
    content: ""; position: absolute;
    inset-inline-start: -6px; top: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .p-timeline-role { font-family: var(--h-font); font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
  [data-theme="dark"] .p-timeline-role { color: #fff; }
  .p-timeline-meta { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .p-timeline-bullets { list-style: disc; margin-inline-start: 20px; font-size: 13.5px; color: var(--text-muted); }
  .p-certs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-top: 10px; }
  .p-cert-card {
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
    padding: 22px; background: var(--surface); display: flex; flex-direction: column;
    justify-content: space-between; gap: 14px;
  }
  .p-cert-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow); border-color: var(--accent); }
  .p-cert-header { display: flex; align-items: flex-start; gap: 14px; }
  .p-cert-icon {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    background: rgba(14,165,233,0.1); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .p-cert-title { font-family: var(--h-font); font-size: 14.5px; font-weight: 700; color: var(--primary); line-height: 1.45; }
  [data-theme="dark"] .p-cert-title { color: #fff; }
  .p-cert-badge {
    align-self: flex-start; font-size: 11.5px; font-weight: 700;
    padding: 4px 11px; border-radius: 6px;
    background: rgba(14,165,233,0.12); color: var(--accent);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .p-projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .p-project-card {
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
    overflow: hidden; background: var(--surface); display: flex; flex-direction: column;
  }
  .p-project-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow); border-color: var(--accent); }
  .p-project-img { width: 100%; height: 160px; object-fit: cover; background: var(--bg); }
  .p-project-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
  .p-project-title { font-family: var(--h-font); font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  [data-theme="dark"] .p-project-title { color: #fff; }
  .p-project-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 14px; flex: 1; }
  .p-tags-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .p-tag { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(14,165,233,0.1); color: var(--accent); }
  .p-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .p-skill-cat { margin-bottom: 20px; }
  .p-skill-cat h4 { font-family: var(--h-font); font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  [data-theme="dark"] .p-skill-cat h4 { color: #fff; }
  .p-skill-item { display: flex; flex-direction: column; gap: 6px; }
  .p-skill-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text); }
  .p-skill-pct { color: var(--accent); font-family: monospace; font-size: 12.5px; }
  .p-skill-bar-bg { width: 100%; height: var(--skill-bar-height); background: var(--border); border-radius: var(--radius); overflow: hidden; }
  .p-skill-bar-fill { height: 100%; background: var(--accent); border-radius: var(--radius); transition: width 1s ease-in-out; }
  .p-contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .p-contact-item { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; }
  .p-contact-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); box-shadow: var(--card-shadow); }
  .p-contact-item i { font-size: 20px; color: var(--primary); }
  [data-theme="dark"] .p-contact-item i { color: var(--accent); }
  .p-footer { 
    text-align: center; padding: 36px 20px; font-size: 13.5px; color: var(--text-muted); 
    border-top: 1px solid var(--border); margin-top: 48px; 
  }
  @media(max-width: 1024px) {
    .p-wrapper { grid-template-columns: 1fr !important; }
    .p-sidebar { position: static; max-width: 520px; margin: 0 auto; width: 100%; }
    .p-nav { padding: 14px 24px; }
    .p-stats-grid { grid-template-columns: 1fr 1fr; }
    .p-two-col { grid-template-columns: 1fr; }
  }
  @media(max-width: 768px) {
    .p-nav-links, .p-nav-actions .p-btn { display: none; }
    .p-mobile-menu-btn { display: inline-flex; }
    .p-wrapper { padding: 0 16px; margin: 24px auto; }
    .p-card { padding: 22px 16px; }
    .p-stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .p-stat-box b { font-size: 24px; }
  }
  .print-only-contact { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { background: #fff !important; color: #000 !important; font-size: 11pt !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .p-nav, .p-mobile-menu-btn, .p-mobile-drawer, .p-btn, #themeToggleBtn, #langSwitcherBtn, #contact { display: none !important; }
    .p-wrapper { display: block !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
    .p-sidebar { position: static !important; width: 100% !important; max-width: 100% !important; margin-bottom: 20px !important; border: none !important; box-shadow: none !important; padding: 10px !important; text-align: center; }
    .p-profile-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    .p-avatar-wrap { width: 120px; height: 120px; margin: 0 auto 10px; }
    .print-only-contact { display: flex !important; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 10px; font-size: 10pt; font-weight: bold; color: #333; }
    .p-card { border: 1px solid #ddd !important; box-shadow: none !important; padding: 16px !important; margin-bottom: 16px !important; page-break-inside: avoid; }
    .p-timeline-item { padding-bottom: 16px; page-break-inside: avoid; }
    .p-two-col { display: block !important; }
    .p-certs-grid, .p-projects-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .p-footer { margin-top: 20px !important; padding: 16px !important; page-break-inside: avoid !important; }
  }
</style>
</head>
<body>
  <nav class="p-nav">
    <div class="p-logo" id="navBrand">Portfolio</div>
    <div class="p-nav-links" id="dynamicNavLinks"></div>
    <div class="p-nav-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="Dark / Light"><i class="fa-solid fa-moon"></i></button>
      <button class="lang-select-btn" id="langSwitcherBtn">
        <i class="fa-solid fa-globe"></i> <span id="currentLangLabel">العربية</span>
      </button>
      <a href="#contact" class="p-btn p-btn-primary" id="l_startBtn">Start a Project</a>
      <button class="p-mobile-menu-btn" id="mobileMenuToggle" aria-label="Toggle Mobile Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>
  <div class="p-mobile-drawer" id="mobileDrawer"></div>

  <div class="p-wrapper" id="portfolioMainWrapper">
    <aside class="p-sidebar">
      <div class="p-profile-card">
        <div class="p-avatar-wrap" id="p_avatar_wrap">
          <img id="p_avatar" src="" alt="Profile" style="display:none;">
          <i class="fa-solid fa-user" id="p_avatar_placeholder" style="font-size:56px; color:#fff;"></i>
        </div>
        <h1 id="p_name"></h1>
        <h2 id="p_role"></h2>
        <div class="print-only-contact" id="printContact"></div>
        <div class="p-chips-row" id="p_chips" style="margin-top:16px;"></div>
        <p id="p_lead"></p>
        <div class="p-profile-actions">
          <button id="p_cvBtn" class="p-btn p-btn-primary"></button>
          <a href="#contact" class="p-btn p-btn-outline" id="p_contactBtn"></a>
        </div>
        <div class="p-social-row" id="p_socials"></div>
      </div>
    </aside>
    <main class="p-content">
      <section class="p-card" id="about">
        <div class="p-section-head" id="head_about"><i class="fa-regular fa-user" style="color:var(--accent);"></i> About Me</div>
        <p style="color:var(--text-muted); font-size:14.5px; line-height:1.75;" id="sec_about_text"></p>
        <div class="p-stats-grid" id="statsContainer"></div>
      </section>
      <section class="p-card" id="experience">
        <div class="p-section-head" id="head_exp"><i class="fa-solid fa-briefcase" style="color:var(--accent);"></i> Work Experience</div>
        <div class="p-timeline" id="expContainer"></div>
      </section>
      <div class="p-two-col">
        <section class="p-card" id="skills">
          <div class="p-section-head" id="head_skills"><i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> Skills</div>
          <div id="skillsContainer"></div>
        </section>

        <section class="p-card" id="education">
          <div class="p-section-head" id="head_edu"><i class="fa-solid fa-graduation-cap" style="color:var(--accent);"></i> Education</div>
          <div id="eduContainer">
            <div style="margin-bottom:16px;">
              <h4 style="font-size:15px; color:var(--primary); font-weight:700;" id="edu_deg_title"></h4>
              <p style="font-size:13px; color:var(--text-muted);" id="edu_deg_meta"></p>
            </div>
            <div>
              <h4 style="font-size:15px; color:var(--primary); font-weight:700;" id="edu_cert_title"></h4>
              <p style="font-size:13px; color:var(--text-muted);" id="edu_cert_meta"></p>
            </div>
          </div>
        </section>
      </div>
      <section class="p-card" id="certs">
        <div class="p-section-head" id="head_certs"><i class="fa-solid fa-certificate" style="color:var(--accent);"></i> Certifications</div>
        <div class="p-certs-grid" id="certsContainer"></div>
      </section>
      <section class="p-card" id="projects">
        <div class="p-section-head" id="head_projects"><i class="fa-solid fa-diagram-project" style="color:var(--accent);"></i> Projects</div>
        <div class="p-projects-grid" id="projectsContainer"></div>
      </section>
      <section class="p-card" id="contact">
        <div class="p-section-head" id="head_contact"><i class="fa-regular fa-paper-plane" style="color:var(--accent);"></i> Contact Me</div>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;" id="contactMeta"></p>
        <div class="p-contact-grid" id="contactGrid"></div>
      </section>

    </main>
  </div>
  <footer class="p-footer" id="footerText">
    <span>© Abdelmoneim. All Rights Reserved.</span>
  </footer>

<script>
// Security Helpers for Template Context
  function escapeHTML(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
    });
  }
  function sanitizeURL(url) {
    if (typeof url !== 'string') return '#';
    var safeUrl = url.trim();
    if (safeUrl.toLowerCase().indexOf('javascript:') === 0) return '#';
    return escapeHTML(safeUrl);

    var imgPlaceholder = document.getElementById('p_avatar_placeholder');
    if(g.aboutData && g.aboutData.profileImg) {
      imgEl.src = sanitizeURL(g.aboutData.profileImg);
      imgEl.style.display = 'block';
      imgPlaceholder.style.display = 'none';
    } else {
      imgEl.style.display = 'none';
      imgPlaceholder.style.display = 'block';
    }

    document.getElementById('p_name').innerText = (d.hero && d.hero.brandName) ? d.hero.brandName : (lang === 'ar' ? 'الاسم لم يحدد' : 'Name not set');
    document.getElementById('p_role').innerText = (d.hero && (d.hero.eyebrow || d.hero.title1)) ? (d.hero.eyebrow || d.hero.title1) : '';
    document.getElementById('p_lead').innerText = (d.about && d.about.p1) ? d.about.p1 : ((d.hero && d.hero.lead) ? d.hero.lead : '');

    // Print-Only Contact Data (for PDF)
    var printContactHtml = '';
    if(g.contactData && g.contactData.phone) printContactHtml += '<span><i class="fa-solid fa-phone"></i> ' + escapeHTML(g.contactData.phone) + '</span>';
    if(g.contactData && g.contactData.email) printContactHtml += '<span><i class="fa-solid fa-envelope"></i> ' + escapeHTML(g.contactData.email) + '</span>';
    if(d.contact && d.contact.location) printContactHtml += '<span><i class="fa-solid fa-location-dot"></i> ' + escapeHTML(d.contact.location) + '</span>';
    document.getElementById('printContact').innerHTML = printContactHtml;

    // Floating Chips
    var chipsCont = document.getElementById('p_chips');
    chipsCont.innerHTML = (d.chips || []).map(function(c) {
      return '<span class="p-chip"><i class="' + getIconCls(escapeHTML(c.icon)) + '"></i> ' + escapeHTML(c.label || '') + '</span>';
    }).join('');

    // CV Download / PDF Trigger
    var cvBtn = document.getElementById('p_cvBtn');
    cvBtn.innerText = dict.downloadCv;
    cvBtn.onclick = function() {
      if(g.contactData && g.contactData.cvLink && g.contactData.cvLink.trim().length > 3) {
        window.open(sanitizeURL(g.contactData.cvLink), '_blank');
      } else {
        generateProfessionalPDF();
      }
    };

    document.getElementById('p_contactBtn').innerText = dict.contactBtn;

    // Social Links
    var socialCont = document.getElementById('p_socials');
    var socialsHtml = '';
    if(g.contactData && g.contactData.email) socialsHtml += '<a href="mailto:' + escapeHTML(g.contactData.email) + '" title="Email"><i class="fa-solid fa-envelope"></i></a>';
    if(g.contactData && g.contactData.phone) socialsHtml += '<a href="tel:' + escapeHTML(g.contactData.phone) + '" title="Phone"><i class="fa-solid fa-phone"></i></a>';
    if(g.contactData && g.contactData.linkedin) socialsHtml += '<a href="' + sanitizeURL(g.contactData.linkedin) + '" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>';
    if(g.contactData && g.contactData.website) socialsHtml += '<a href="' + sanitizeURL(g.contactData.website) + '" target="_blank" title="Website"><i class="fa-solid fa-globe"></i></a>';
    socialCont.innerHTML = socialsHtml;

    // About & Stats
    document.getElementById('sec_about_text').innerText = (d.about && d.about.p1) ? d.about.p1 : ((d.hero && d.hero.lead) ? d.hero.lead : '');
    document.getElementById('statsContainer').innerHTML = (d.stats || []).map(function(s) {
      return '<div class="p-stat-box"><b>' + escapeHTML(s.value || 0) + '+</b><span>' + escapeHTML(s.label || '') + '</span></div>';
    }).join('');

    // Experience Section
    var expCont = document.getElementById('expContainer');
    if(d.experience && d.experience.length) {
      expCont.innerHTML = d.experience.map(function(exp) {
        var bulletsHtml = (exp.bullets || []).map(function(b) { return '<li>' + escapeHTML(b) + '</li>'; }).join('');
        return '<div class="p-timeline-item">' +
          '<div class="p-timeline-role">' + escapeHTML(exp.role || '') + '</div>' +
          '<div class="p-timeline-meta">' + escapeHTML(exp.company || '') + (exp.period ? ' · ' + escapeHTML(exp.period) : '') + '</div>' +
          '<ul class="p-timeline-bullets">' + bulletsHtml + '</ul>' +
        '</div>';
      }).join('');
    } else {
      expCont.innerHTML = '<div class="p-empty-state">' + dict.emptyExp + '</div>';
    }

    // Skills Matrix (Progress Bars)
    var skillsCont = document.getElementById('skillsContainer');
    if(d.skillCats && d.skillCats.length) {
      skillsCont.innerHTML = d.skillCats.map(function(cat) {
        var barsHtml = (cat.skills || []).map(function(s) {
          var val = parseInt(s.value || 0);
          if (val > 100) val = 100;
          if (val < 0) val = 0;
          return '<div class="p-skill-item">' +
            '<div class="p-skill-header"><span>' + escapeHTML(s.label || '') + '</span><span class="p-skill-pct">' + val + '%</span></div>' +
            '<div class="p-skill-bar-bg"><div class="p-skill-bar-fill" style="width:' + val + '%;"></div></div>' +
          '</div>';
        }).join('');
        return '<div class="p-skill-cat">' +
          '<h4><i class="' + getIconCls(escapeHTML(cat.icon)) + '" style="color:var(--accent);"></i> ' + escapeHTML(cat.name || '') + '</h4>' +
          '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">' + barsHtml + '</div>' +
        '</div>';
      }).join('');
    } else {
      skillsCont.innerHTML = '<div class="p-empty-state">' + dict.emptySkills + '</div>';
    }

    // Education
    var eduCont = document.getElementById('eduContainer');
    if(d.education && (d.education.degreeTitle || d.education.icdlTitle)) {
      document.getElementById('edu_deg_title').innerText = d.education.degreeTitle || "";
      document.getElementById('edu_deg_meta').innerText = d.education.degreeMeta || "";
      document.getElementById('edu_cert_title').innerText = d.education.icdlTitle || "";
      document.getElementById('edu_cert_meta').innerText = d.education.icdlMeta || "";
    } else {
      eduCont.innerHTML = '<div class="p-empty-state">' + dict.emptyEdu + '</div>';
    }

    // Certifications & Courses (Images instead of Icons if provided)
    var certsCont = document.getElementById('certsContainer');
    var allCerts = [];
    (d.certsElaraby || []).forEach(function(c) {
      if(c) {
        let title = typeof c === 'string' ? c : (c.title || '');
        let img = typeof c === 'string' ? '' : (c.img || '');
        if(title.trim()) allCerts.push({ title: title, img: img, type: dict.profTrack, icon: 'fa-certificate' });
      }
    });
    (d.certsAlmentor || []).forEach(function(c) {
      if(c) {
        let title = typeof c === 'string' ? c : (c.title || '');
        let img = typeof c === 'string' ? '' : (c.img || '');
        if(title.trim()) allCerts.push({ title: title, img: img, type: dict.techTrack, icon: 'fa-award' });
      }
    });

    if(allCerts.length) {
      certsCont.innerHTML = allCerts.map(function(item) {
        var visual = item.img ? '<img src="' + sanitizeURL(item.img) + '" alt="' + escapeHTML(item.title) + '" style="width:42px; height:42px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--border);">' : '<div class="p-cert-icon"><i class="fa-solid ' + escapeHTML(item.icon) + '"></i></div>';
        return '<div class="p-cert-card">' +
          '<div class="p-cert-header">' +
            visual +
            '<div>' +
              '<div class="p-cert-title">' + escapeHTML(item.title || '') + '</div>' +
              '<span style="font-size:11.5px; color:var(--text-muted);">' + item.type + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="p-cert-badge"><i class="fa-solid fa-circle-check"></i> ' + dict.verifiedCert + '</div>' +
        '</div>';
      }).join('');
    } else {
      certsCont.innerHTML = '<div class="p-empty-state" style="grid-column:1/-1;">' + dict.emptyCerts + '</div>';
    }

    // Projects
    var projCont = document.getElementById('projectsContainer');
    if(d.projects && d.projects.length) {
      projCont.innerHTML = d.projects.map(function(p) {
        var tagsHtml = (p.tags || []).map(function(t) { return '<span class="p-tag">' + escapeHTML(t) + '</span>'; }).join('');
        var linkHtml = p.link ? '<div class="p-project-actions"><a href="' + sanitizeURL(p.link) + '" target="_blank" class="p-btn p-btn-outline" style="padding:6px 12px; font-size:12px;"><i class="fa-solid fa-arrow-up-right-from-square"></i> المعاينة / Preview</a></div>' : '';
        var imgHtml = p.img ? '<img src="' + sanitizeURL(p.img) + '" class="p-project-img" alt="' + escapeHTML(p.title || '') + '">' : '<div class="p-project-img" style="display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--accent);"><i class="' + getIconCls(escapeHTML(p.icon)) + '"></i></div>';
        return '<div class="p-project-card">' +
          imgHtml +
          '<div class="p-project-body">' +
            '<div class="p-project-title">' + escapeHTML(p.title || '') + '</div>' +
            '<div class="p-project-desc">' + escapeHTML(p.desc || '') + '</div>' +
            '<div class="p-tags-group">' + tagsHtml + '</div>' +
            linkHtml +
          '</div>' +
        '</div>';
      }).join('');
    } else {
      projCont.innerHTML = '<div class="p-empty-state" style="grid-column:1/-1;">' + dict.emptyProj + '</div>';
    }

    // Contact Information Grid 
    var contactGrid = document.getElementById('contactGrid');
    var contactItems = [];
    if(d.contact && d.contact.location) {
      contactItems.push('<a href="#" class="p-contact-item" style="pointer-events:none;"><i class="fa-solid fa-location-dot"></i> ' + escapeHTML(d.contact.location) + '</a>');
    }
    if(g.contactData && g.contactData.email) {
      contactItems.push('<a href="mailto:' + escapeHTML(g.contactData.email) + '" class="p-contact-item"><i class="fa-solid fa-envelope"></i> ' + escapeHTML(g.contactData.email) + '</a>');
    }
    if(g.contactData && g.contactData.phone) {
      contactItems.push('<a href="tel:' + escapeHTML(g.contactData.phone) + '" class="p-contact-item"><i class="fa-solid fa-phone"></i> ' + escapeHTML(g.contactData.phone) + '</a>');
    }
    if(g.contactData && g.contactData.linkedin) {
      contactItems.push('<a href="' + sanitizeURL(g.contactData.linkedin) + '" target="_blank" class="p-contact-item"><i class="fa-brands fa-linkedin"></i> LinkedIn Profile</a>');
    }
    if (contactItems.length > 0) {
      contactGrid.innerHTML = contactItems.join('');
    } else {
      contactGrid.innerHTML = '<div class="p-empty-state" style="grid-column:1/-1;">لم تتم إضافة بيانات تواصل.</div>';
    }

    var metaTxt = [];
    if(d.contact && (d.contact.eyebrow || d.contact.title)) metaTxt.push(d.contact.eyebrow || d.contact.title);
    document.getElementById('contactMeta').innerText = metaTxt.join(' · ');
    document.getElementById('footerText').innerHTML = '<span>' + dict.rights + '</span>';
  }

  // Hamburger Mobile Toggle
  var mobileToggleBtn = document.getElementById('mobileMenuToggle');
  if (mobileToggleBtn) {
    mobileToggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      var drawer = document.getElementById('mobileDrawer');
      if (drawer) drawer.classList.toggle('open');
    });
  }

  document.getElementById('langSwitcherBtn').addEventListener('click', function() {
    renderPortfolio(currLang === 'ar' ? 'en' : 'ar');
  });

  var themeBtn = document.getElementById('themeToggleBtn');
  function applyTheme(dark) {
    isDarkMode = dark;
    if(dark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
  }
  themeBtn.addEventListener('click', function() { applyTheme(!isDarkMode); });
  applyTheme(isDarkMode);

  // ========================================================
  // SELF-CONTAINED INTERNAL ANCHOR NAVIGATION (No Parent Leak)
  // ========================================================
  document.addEventListener('click', function(e) {
    var anchor = e.target.closest('a');
    if (!anchor) return;
    var href = anchor.getAttribute('href');

    // Only intercept internal section hash links
    if (href && href.charAt(0) === '#') {
      e.preventDefault();
      e.stopPropagation();

      if (href.length > 1) {
        var targetId = href.substring(1);
        var targetEl = document.getElementById(targetId);
        if (targetEl) {
          var navEl = document.querySelector('.p-nav');
          var navHeight = navEl ? navEl.offsetHeight + 15 : 80;
          var elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
          var offsetPosition = Math.max(0, elementPosition - navHeight);

          window.scrollTo({
            top: offsetPosition,
            behavior: 'smooth'
          });
        }
      }

      var drawer = document.getElementById('mobileDrawer');
      if (drawer) drawer.classList.remove('open');
    }
  }, true);

  // Close mobile drawer on clicking outside
  document.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== mobileToggleBtn && !mobileToggleBtn.contains(e.target)) {
      drawer.classList.remove('open');
    }
  });

  // Active Nav Link Spy on Scroll
  window.addEventListener('scroll', function() {
    var sections = document.querySelectorAll('section[id]');
    var scrollPos = window.pageYOffset + 120;
    sections.forEach(function(sec) {
      var top = sec.getBoundingClientRect().top + window.pageYOffset;
      var height = sec.offsetHeight;
      var id = sec.getAttribute('id');
      if(scrollPos >= top && scrollPos < top + height) {
        document.querySelectorAll('.p-nav-links a, .p-mobile-drawer a').forEach(function(a) {
          if (a.getAttribute('href') === '#' + id) {
            a.classList.add('active');
          } else if (a.getAttribute('href') && a.getAttribute('href').indexOf('#') === 0) {
            a.classList.remove('active');
          }
        });
      }
    });
  });

  // Client-Side Anti-Tampering & Copy-Protection Layer
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('dragstart', function(e) { if (e.target.nodeName === 'IMG') e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'a')) {
      if (['INPUT', 'TEXTAREA'].indexOf(e.target.nodeName) === -1) { e.preventDefault(); }
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))) {
      e.preventDefault();
    }
  });

  renderPortfolio(currLang);
</script>
</body>
</html>
